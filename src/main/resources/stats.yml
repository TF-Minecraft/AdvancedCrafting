standard:
  name: "§fStandard Weapon"
  icon: v.iron_sword
  base-stats:
    - attack_speed(1.6)
  stats:
    - attack_damage
    - attack_speed
    - pvp_damage
    - physical_damage
    - magic_damage
    - spell_vampirism
    - lifesteal
    - max_item_damage
  factors:
    attack_damage: 0.90

sword:
  name: "§fSword"
  icon: v.iron_sword
  base-stats:
    - attack_speed(1.6)
  stats:
    - attack_damage
    - attack_speed
    - physical_damage
    - magic_damage
    - spell_vampirism
    - lifesteal
    - max_item_damage
  # Sword = steady damage, no extra bonus: each tier of leather and wool adds 0.125 attack damage,
  # around rare (tier 2), so common/rare/epic/legendary give -0.25/0/+0.25/+0.5 (2026-11-11).
  tier-bonus:
    leather: attack_damage(0.125)
    wool: attack_damage(0.125)
  tier-bonus-neutral: 2

