    - attack_damage
    - attack_speed
    - physical_damage
    - magic_damage
    - spell_vampirism
    - lifesteal
    - entity_interaction_range
    - max_item_damage
  # Reach: 0.2 from the spear + leather/wool 0.03-0.10 each = 0.26-0.40 (2026-11-11).
  factors:
    attack_damage: 0.90

polearm:
  name: "§fPolearm"
  icon: v.trident
  base-stats:
    - attack_speed(1.2)
    - entity_interaction_range(0.4)
  stats:
    - attack_damage
    - attack_speed
    - physical_damage
    - magic_damage
    - spell_vampirism
    - lifesteal
    - entity_interaction_range
    - max_item_damage
  # Reach: 0.4 from the polearm + leather/wool 0.03-0.10 each = 0.46-0.60 (2026-11-11).
  # Two-handed (2026-11-01): no off-hand, so hits deal 1.5x to keep up with a one-hander
  # plus shortsword/shield at the slower 1.2 attack speed.
  factors:
    attack_damage: 1.5

longsword:
  name: "§fLongsword"
  icon: v.iron_sword
  base-stats:
    - attack_speed(1.2)
    - critical_strike_chance(5.0)
  stats:
