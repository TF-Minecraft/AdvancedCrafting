    - critical_strike_chance
    - max_item_damage
  # Two-handed (2026-11-01): no off-hand, so hits deal 1.5x to keep up with a one-hander
  # plus shortsword/shield at the slower 1.2 attack speed.
  factors:
    attack_damage: 1.5

greathammer:
  name: "§fGreathammer"
  icon: v.netherite_axe
  base-stats:
    - attack_speed(1.2)
    - blunt_power(3)
    - damage_reduction(4.0)
  stats:
    - attack_damage
    - attack_speed
    - blunt_power
    - blunt_rating
    - physical_damage
    - magic_damage
    - spell_vampirism
    - lifesteal
    - damage_reduction
    - max_item_damage
  # Two-handed (2026-11-01): no off-hand, so hits deal 1.5x to keep up with a one-hander
  # plus shortsword/shield at the slower 1.2 attack speed.
  # Blunt splash = blunt_rating % of the hit (MythicLib base 33 does not add): x0.9 = 45-72%.
  factors:
    attack_damage: 1.5
    blunt_rating: 0.9

greataxe:
  name: "§fGreataxe"
  icon: v.netherite_axe
  base-stats:
    - attack_speed(1.2)
    - blunt_power(3)
  stats:
    - attack_damage
    - attack_speed
    - blunt_power
    - blunt_rating
    - physical_damage
    - magic_damage
    - spell_vampirism
    - lifesteal
    - movement_speed
    - max_item_damage
  # Two-handed, so it never has an off-hand shortsword: movement is leather/wool x 1.5 = 0.9-1.8,
  # a battleaxe plus a shortsword (half a battleaxe), so a battleaxe is 2/3 of it (2026-11-11).
  # Two-handed (2026-11-01): no off-hand, so hits deal 1.5x to keep up with a one-hander
  # plus shortsword/shield at the slower 1.2 attack speed.
  # Blunt splash = blunt_rating % of the hit (MythicLib base 33 does not add): x0.9 = 45-72%.
  factors:
    movement_speed: 1.5
    attack_damage: 1.5
    blunt_rating: 0.9

