scrap-path: crafting.scrap
branding-tool: m.tools.skin_branding_tool

# Staff-only finished equipment command. Missing/blank values use advancedcrafting.admin.
# Grant a custom node only to staff; it does not grant the other admin commands.
give-equipment-permission: advancedcrafting.admin

# TLibs block path for each station (iaf(...) for ItemsAdder furniture).
crafting-station: v(ANVIL)
alloy-station: iaf(tfmc:alloy_forge)
ingredient-station: iaf(tfmc:ingredient_converter)

# New alloy discovery roll: success% = min(max, base + sqrt(totalValue) * bonus + base-bonus). totalValue = sum of ingredient value fields (base + catalysts).
alloy-forge:
  base-success-percent: 2.0
  success-bonus-per-sqrt-value: 4.0
  max-success-percent: 85.0
  # Gemstone catalyst stat roll, before the total-value merge roll. Defaults also apply to existing configs without these keys.
  gem-stat-base-percent: 55.0
  gem-stat-bonus-per-value: 5.0
  # Flat success% added when this ingredient is the base. Catalysts never get it; unlisted ingredients get 0.
  base-bonus-percent:
    steel_ingot: 8.0
    bronze_ingot: 12.0
    abyssalite_ingot: 16.0
    mythril_ingot: 24.0
    refined_maplewood: 8.0
    refined_elderwood: 16.0
    refined_demonwood: 24.0

max-factor: 1.2

# Alloys follow later changes to their base ingredient's stats on startup: each alloy keeps its own
# difference from the base and only the base's share moves (alloy files are backed up to
# data/alloy-backups first). New alloys record their base. Alloys forged before that was recorded
# use these base values when their file is older than forged-before (ISO-8601, blank = off).
alloy-legacy-base:
  forged-before: ""
  stats: {}
#   steel_ingot:
#     - weapon_damage(12.0)

# Warn when a tool is this many percent over its requirement (16 vs 12 = 33).
# Set to 0 or below to disable. Existing live configs keep working via loader defaults.
hit-overshoot-warn-percent: 30.0
hit-overshoot-warn-message: "§cYour over-reliance on %hit% ruins the result further"

# Raw stat lines on ingredient/alloy items. Converter GUI still shows per-template factors.
show-ingredient-stats: true

# Log stat template / ingredient revision refreshes to console ([AC][StatRefresh]).
debug-stat-refresh: false

# Divide bucket-averaged stat values before template factors (movement_speed config uses ~100x larger numbers than MMOItems).
global-stat-offsets:
  movement_speed: 100

stat-aliases:
    - max_item_damage->Durability
    - max_health->Max Health
    - health_regeneration->Health Regeneration
    - armor->Armor
    - armor_toughness->Armor Toughness
    - damage_reduction->Damage Reduction
    - pvp_damage_reduction->PvP Damage Reduction
    - physical_damage_reduction->Physical Damage Reduction
    - projectile_damage_reduction->Projectile Damage Reduction 
    - magic_damage_reduction->Magic Damage Reduction
    - fall_damage_reduction->Fall Damage Reduction
    - fire_damage_reduction->Fire Damage Reduction
    - attack_damage->Attack Damage
    - blunt_rating->Blunt Rating
    - blunt_power->Blunt Power
    - pvp_damage->PvP Damage
    - physical_damage->Physical Damage
    - projectile_damage->Projectile Damage
    - magic_damage->Magic Damage
    - skill_damage->Skill Damage
    - spell_vampirism->Spell Vampirism
    - lifesteal->Lifesteal
    - critical_strike_chance->Critical Strike Chance
    - parry_rating->Parry Rating
    - dodge_rating->Dodge Rating
    - movement_speed->Movement Speed
    - max_mana->Max Mana
    - cooldown_reduction->Cooldown Reduction

combinations:
    metal:
        - crystal
    wood:
        - crystal

permission-prefix: professions.

permission-namespaces:
  ingredient:
    display: "#e6a817Ingredient"
  iron_smith:
    display: "#e6a817Iron Smithing"
  steel_smith:
    display: "#e6a817Steel Smithing"
  abyssalite_smith:
    display: "#e6a817Abyssalite Smithing"
  mythril_smith:
    display: "#e6a817Mythril Smithing"

