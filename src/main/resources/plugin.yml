main: net.tfminecraft.advancedcrafting.AdvancedCrafting
api-version: '1.21.10'
name: AdvancedCrafting
version: ${project.version}
author: Drefvelin

depend: [TLibs, MMOCore, MMOItems, MythicLib]
softdepend: [NBTAPI]

commands:
  ac:
    usage: /<command>
    description: AdvancedCrafting Command
  alloy:
    usage: "/<command> name <name> | recipes | recipe [name]"
    description: Name a new alloy, or see the recipes of alloys you have forged

permissions:
  advancedcrafting.admin:
    description: AdvancedCrafting admin commands
    default: op
